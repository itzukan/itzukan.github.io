<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1120"><meta name="description" content="SQL実務トレーニングの無料体験3問を選び、進捗を確認できます。"><link rel="canonical" href="https://free.itzukan.com/materials/sql/course/learn/"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>無料体験の問題一覧｜SQL実務トレーニング｜IT図鑑</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #eef6ff; background: #091322; font: 16px/1.65 system-ui, sans-serif; color-scheme: dark; }
  .wrap { width: min(760px, calc(100% - 32px)); margin-inline: auto; }
  a { color: #94eaf2; text-underline-offset: .2em; }
  :focus-visible { outline: 3px solid #94eaf2; outline-offset: 3px; }
  header { border-bottom: 1px solid #31435e; }
  header .wrap { padding: 14px 0; }
  header a { font-weight: 750; }
  main { padding: 28px 0 42px; }
  h1, h2, p { margin: 0; }
  h1 { font-size: clamp(1.65rem, 5vw, 2.25rem); line-height: 1.25; margin: 4px 0 9px; }
  h2 { font-size: 1.2rem; }
  .label { color: #94eaf2; font-weight: 700; }
  .muted { color: #bed0e5; }
  section { margin-top: 22px; padding: 16px; background: #102139; border: 1px solid #3b5372; border-radius: 12px; }
  .progress-info { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 14px; }
  progress { display: block; width: 100%; margin: 8px 0 15px; accent-color: #4dd8e8; }
  .button { display: inline-block; background: #67e8f9; color: #091322; font-weight: 800; text-decoration: none; padding: 8px 12px; border-radius: 8px; }
  .trial-list { list-style: none; margin: 0; padding: 0; }
  .trial-row { display: grid; align-items: center; grid-template-columns: auto minmax(0, 1fr) auto; gap: 5px 12px; padding: 13px 0; border-top: 1px solid #3b5372; }
  .trial-row:first-child { border: 0; }
  .trial-row a { white-space: nowrap; font-weight: 750; }
  .trial-row label { font-weight: 700; }
  .trial-row small, .mission-id { display: block; color: #bed0e5; font-size: .84rem; font-weight: 500; }
  .check { width: 18px; height: 18px; margin: 0; accent-color: #4dd8e8; }
  .check:checked + label .completion::before { content: "完了"; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  .reset { background: none; color: #bed0e5; border: 0; padding: 0; font: inherit; font-size: .9rem; text-decoration: underline; cursor: pointer; }
  .reset:disabled { opacity: .62; cursor: default; }
  .offer p { margin: 5px 0 10px; }
  @media (max-width: 440px) {
    .trial-row { grid-template-columns: auto 1fr; }
    .trial-row a { grid-column: 2; justify-self: start; }
  }
</style>
<link rel="stylesheet" href="/assets/materials-header.css?v=3"><script defer src="/assets/materials-header.js?v=4"></script><script defer src="/assets/material-pin-sync.js?v=8"></script><script defer src="/assets/materials-search.js?v=8"></script></head>
<body>
  <header data-library-header><nav class="wrap" aria-label="教材メニュー"><a href="/materials/">IT図鑑トップ</a> <a class="lesson-search-link" href="/materials/#search-materials">教材を検索</a></nav></header>
  <main class="wrap">
    <p class="label">SQL実務トレーニング</p>
    <h1>無料体験の問題一覧</h1>
    <p class="muted">ブラウザでSQLを書いて、結合・集計などを3問試せます。</p>
    <section aria-labelledby="progress-title">
      <div class="progress-info"><h2 id="progress-title">無料体験の進捗</h2><output id="completed">0 / 3問</output></div>
      <progress id="progress" max="3" value="0" aria-labelledby="progress-title"></progress>
      <div class="actions">
        <a id="resume" class="button" href="/materials/sql/training-demo/?mission=08">問題08を始める →</a>
        <button type="button" class="reset" id="clear" disabled>完了チェックを解除</button>
      </div>
    </section>
    <section aria-label="無料体験3問">
      <ol class="trial-list">
          <li class="trial-row">
            <input class="check" type="checkbox" id="completed-08" data-mission="8">
            <label for="completed-08"><span class="mission-id">問題08</span> 注文に商品名と売上を付ける<small>完了にする</small></label>
            <a href="/materials/sql/training-demo/?mission=08">体験する →</a>
          </li>
          <li class="trial-row">
            <input class="check" type="checkbox" id="completed-11" data-mission="11">
            <label for="completed-11"><span class="mission-id">問題11</span> 未購入顧客を探す<small>完了にする</small></label>
            <a href="/materials/sql/training-demo/?mission=11">体験する →</a>
          </li>
          <li class="trial-row">
            <input class="check" type="checkbox" id="completed-14" data-mission="14">
            <label for="completed-14"><span class="mission-id">問題14</span> 商品別売上ランキング<small>完了にする</small></label>
            <a href="/materials/sql/training-demo/?mission=14">体験する →</a>
          </li>
      </ol>
      <p class="muted">正解すると自動で完了になります。記録はこのブラウザに保存されます。</p>
    </section>
    <section class="offer" aria-labelledby="offer-title">
      <h2 id="offer-title">SQL実務トレーニング30問</h2>
      <p class="muted">有料版では、データの検索から月次レポート作成まで全5章を練習できます。</p>
      <a href="https://premium.itzukan.com/courses/sql30/#curriculum">有料版30問の内容を見る →</a>
    </section>
  </main>
  <script>
    const storageKey = 'itzukan-sql-course-preview-completed-v1';
    const checks = [...document.querySelectorAll('input[data-mission]')];
    const completed = document.querySelector('#completed');
    const progress = document.querySelector('#progress');
    const resume = document.querySelector('#resume');
    const clear = document.querySelector('#clear');
    const trialUrl = '/materials/sql/training-demo/';

    function refresh() {
      const count = checks.filter(check => check.checked).length;
      completed.value = count + ' / ' + checks.length + '問';
      progress.value = count;
      clear.disabled = count === 0;

      const next = checks.find(check => !check.checked);
      const mission = next?.id.slice(-2);
      resume.href = mission ? trialUrl + '?mission=' + mission : trialUrl;
      resume.textContent = mission ? '問題' + mission + (count ? 'から再開 →' : 'を始める →') : '無料体験をもう一度見る →';
      checks.forEach(check => {
        check.labels[0].querySelector('small').textContent = check.checked ? '完了' : '完了にする';
      });
    }

    function loadProgress() {
      let saved = [];
      try {
        const value = JSON.parse(localStorage.getItem(storageKey));
        if (Array.isArray(value)) saved = value;
      } catch {}
      checks.forEach(check => { check.checked = saved.includes(Number(check.dataset.mission)); });
      refresh();
    }

    function saveProgress() {
      const saved = checks.filter(check => check.checked).map(check => Number(check.dataset.mission));
      try {
        localStorage.setItem(storageKey, JSON.stringify(saved));
      } catch {}
      refresh();
    }

    checks.forEach(check => check.addEventListener('change', saveProgress));
    clear.addEventListener('click', () => {
      if (!confirm('無料体験3問の完了チェックを解除しますか？')) return;
      checks.forEach(check => { check.checked = false; });
      saveProgress();
    });
    window.addEventListener('pageshow', loadProgress);
    window.addEventListener('focus', loadProgress);
    window.addEventListener('storage', event => {
      if (event.key === storageKey || event.key === null) loadProgress();
    });
    loadProgress();
  </script>
</body>
</html>
