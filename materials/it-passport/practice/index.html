<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ITパスポート道場｜IT図鑑</title>
  <meta name="description" content="ITパスポートの確認問題をランダムに出題。答え合わせのあと、その場で教材の図解を読み返せます。">
  <link rel="canonical" href="https://free.itzukan.com/materials/it-passport/practice/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/it-passport-lesson.css">
  <script defer src="/assets/it-passport-practice.js?v=3"></script>
  <script defer src="/assets/analytics.js"></script>
  <style>
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .actions button { min-height: 44px; padding: 7px 15px; border: 1px solid #8beaf6; border-radius: 8px; background: #8beaf6; color: #0b1120; font: inherit; font-weight: 800; cursor: pointer; }
    .actions button:disabled { border-color: #536782; background: #1d3049; color: #bfcee0; cursor: default; }
    .actions .secondary { background: transparent; color: #8beaf6; }
    .resume { margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid #344a66; }
    .practice-continuity { margin-top: 6px; }
    .continuity-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; column-gap: 12px; }
    .continuity-row button { min-height: 44px; padding: 0; border: 0; background: none; color: #8beaf6; font: inherit; font-size: .875rem; text-decoration: underline; text-underline-offset: .2em; cursor: pointer; }
    #storage-status, #copy-status { font-size: .875rem; }
    #resume-link { width: 100%; margin-top: 8px; min-height: 44px; padding: 8px; border: 1px solid #536782; border-radius: 8px; color: inherit; background: #0e192c; font: inherit; }
    .actions:has(> #next[hidden]) { display: none; }
    .practice-result { margin-top: 14px; padding: 10px; border-inline-start: 3px solid currentColor; background: #0e192c; }
    .practice-result[data-correct="true"] { color: #a4ead2; }
    .practice-result[data-correct="false"] { color: #ffd1c9; }
    #review { margin-top: 6px; }
    #review summary { min-height: 44px; padding-block: 8px; color: #8beaf6; cursor: pointer; }
    #review iframe { display: block; width: 100%; min-height: 140px; margin-block: 8px; border: 1px solid #344a66; border-radius: 8px; background: #0b1120; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="wrap">
    <a href="/materials/">IT図鑑トップ</a>
    <a href="/materials/practice/">問題シリーズ</a>
    <a href="/materials/categories/#it-passport">ITパスポートの教材一覧</a>
  </header>
  <main class="wrap">
    <h1>ITパスポート道場</h1>
    <p class="lead">問題を1問ずつ解いて、気になるところは教材の図解で復習できます。</p>
    <section id="setup" class="panel" aria-labelledby="setup-title">
      <div class="resume" id="transfer-panel" hidden>
        <h2>別の端末からの続き</h2>
        <p id="transfer-status" class="note" role="status"></p>
        <div class="actions">
          <button type="button" id="accept-transfer" hidden>リンクの続きから再開</button>
          <button type="button" id="cancel-transfer" class="secondary">閉じる</button>
        </div>
      </div>
      <div class="resume" id="resume-panel" hidden>
        <h2>途中の練習</h2>
        <p class="note" id="resume-status"></p>
        <div class="actions"><button type="button" id="resume" hidden>続きから再開</button></div>
      </div>
      <h2 id="setup-title" tabindex="-1">何問解きますか？</h2>
      <p id="bank-status" class="note" role="status">教材の確認問題を読み込み中…</p>
      <p id="restart-note" class="note" hidden>ここで新しく始めると、保存済みの途中経過が置き換わります。</p>
      <div class="actions">
        <button type="button" data-count="10" disabled>10問</button>
        <button type="button" data-count="20" disabled>20問</button>
        <button type="button" data-count="30" disabled>30問</button>
        <button type="button" id="retry" class="secondary" hidden>再読み込み</button>
      </div>
      <noscript><p>問題を解くにはJavaScriptを有効にしてください。</p></noscript>
    </section>
    <section id="exercise" aria-labelledby="progress" hidden>
      <div class="panel">
        <h2 id="progress" tabindex="-1"></h2>
        <form id="practice-question" class="quiz">
          <fieldset>
            <legend id="prompt"></legend>
            <div id="choices"></div>
          </fieldset>
          <button type="submit">答えを確認</button>
        </form>
        <div id="result" class="practice-result" tabindex="-1" hidden>
          <p><strong id="verdict"></strong></p>
          <p id="explanation"></p>
        </div>
        <div class="actions"><button type="button" id="next" hidden>次の問題</button></div>
      </div>
      <div class="practice-continuity">
        <div class="continuity-row">
          <p class="note" id="storage-status" role="status"></p>
          <button type="button" id="copy-progress">続きのリンクをコピー</button>
        </div>
        <p class="note" id="copy-status" role="status"></p>
        <input type="text" id="resume-link" aria-label="続きのリンク" readonly hidden>
      </div>
      <details id="review">
        <summary>解説を見る（教材の図解）</summary>
        <div id="review-content"></div>
        <a id="source">教材ページを開く</a>
      </details>
    </section>
    <section id="summary" class="panel" aria-labelledby="summary-title" hidden>
      <h2 id="summary-title" tabindex="-1">結果</h2>
      <p id="score"></p>
      <div class="actions">
        <button type="button" id="again">もう一度解く</button>
        <button type="button" id="choose" class="secondary">問題数を選び直す</button>
      </div>
    </section>
  </main>
</body>
</html>
