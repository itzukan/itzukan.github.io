  <header class="wrap">
    <a href="/materials/">IT図鑑トップ</a>
    <a href="/materials/topics/#network">テーマ別の教材</a>
    <a class="lesson-search-link" href="/materials/#search-materials">教材を検索</a>
  </header>
  <main class="wrap" data-feedback-material="topic-mbps-and-megabytes">
    <p class="topic">ネットワーク・通信</p>
    <h1>MbpsとMB/sの違い</h1>
    <p class="lead">1Gbpsの回線で、1秒に何MBを送れる計算になるか見ます。</p>
    <section class="panel topic-figure" aria-labelledby="diagram-title">
      <h2 id="diagram-title">図で仕組みを理解しよう</h2>
      <ol class="sequential">
        <li><span class="topic-icon" aria-hidden="true">🔢</span><strong>1 Gbps＝1,000 Mbps</strong></li>
        <li><span class="topic-icon" aria-hidden="true">🧮</span><strong>8ビットで1バイトなので÷8</strong></li>
        <li><span class="topic-icon" aria-hidden="true">📦</span><strong>理論上は125 MB/s</strong></li>
      </ol>
    </section>
    <section class="panel" aria-labelledby="point-title">
      <h2 id="point-title">ポイント</h2>
      <p>Mbpsの小文字bはビット、MB/sの大文字Bはバイトです。通信の付加情報、回線の混雑、機器の性能などで実効速度は理論値を下回ることがあります。</p>
    </section>
    <section class="panel" aria-labelledby="quiz-title">
      <h2 id="quiz-title">確認問題</h2>
      <form class="quiz" data-answer="1" data-correct="正解。Mbpsの小文字bはビット、MB/sの大文字Bはバイトです。通信の付加情報、回線の混雑、機器の性能などで実効速度は理論値を下回ることがあります。" data-retry="図とポイントを見返して、もう一度考えてみましょう。">
        <fieldset>
          <legend>100Mbpsは理論上何MB/s？</legend>
          <label><input type="radio" name="answer" value="1" required>12.5 MB/s</label>
          <label><input type="radio" name="answer" value="2" required>100 MB/s</label>
        </fieldset>
        <button type="submit">答えを確認</button>
        <output aria-live="polite"></output>
      </form>
      <noscript><details><summary>答えを見る</summary><p>12.5 MB/s</p></details></noscript>
    </section>
    <p><a href="/materials/topics/#network">ネットワーク・通信のほかの教材を見る →</a></p>
  </main>
