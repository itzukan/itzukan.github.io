    <p class="topic">API</p>
    <h1>冪等性とは？同じ依頼が再送されても結果を重複させない</h1>
    <p class="lead">注文確定の返事を受け取れず、同じ注文を再送したときの設計です。</p>
    <section class="panel topic-figure" aria-labelledby="diagram-title">
      <h2 id="diagram-title">図で仕組みを理解しよう</h2>
      <ol class="sequential">
        <li><span class="topic-icon" aria-hidden="true">🛒</span><strong>1回目に注文を記録</strong></li>
        <li><span class="topic-icon" aria-hidden="true">🔁</span><strong>同じ依頼を識別するキーで再送</strong></li>
        <li><span class="topic-icon" aria-hidden="true">✅</span><strong>二重に登録せず前の結果を返す</strong></li>
      </ol>
    </section>
    <section class="panel" aria-labelledby="point-title">
      <h2 id="point-title">ポイント</h2>
      <p>冪等性は同じ操作を繰り返したとき、意図した効果が最初の1回と同じになる性質です。返すレスポンスが必ず同じ意味ではありません。</p>
    </section>

      <h2 id="quiz-title">確認問題</h2>

        <fieldset>
          <legend>返事が途切れた注文操作を再送するには？</legend>
          <label><input type="radio" name="answer" value="1" required>同じ依頼と識別できるよう設計する</label>
          <label><input type="radio" name="answer" value="2" required>再試行するたび必ず別の注文IDを作る</label>
        </fieldset>
