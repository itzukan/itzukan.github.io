<body>
  <header class="wrap">
    <a href="/materials/">IT図鑑トップ</a>
    <a href="/materials/topics/#api">テーマ別の教材</a>
    <a class="lesson-search-link" href="/materials/#search-materials">教材を検索</a>
  </header>
  <main class="wrap" data-feedback-material="topic-api-authentication">
    <p class="topic">API</p>
    <h1>API認証で呼び出し元を確認する</h1>
    <p class="lead">配送先を返すAPIが、誰からの要求か、どの注文を読めるかを判断します。</p>
    <section class="panel topic-figure" aria-labelledby="diagram-title">
      <h2 id="diagram-title">図で仕組みを理解しよう</h2>
      <ol class="sequential">
        <li><span class="topic-icon" aria-hidden="true">📱</span><strong>アプリが認証情報を添える</strong></li>
        <li><span class="topic-icon" aria-hidden="true">🪪</span><strong>APIが有効性と呼び出し元を確認</strong></li>
        <li><span class="topic-icon" aria-hidden="true">🔒</span><strong>許された注文だけ返す</strong></li>
      </ol>
    </section>
    <section class="panel" aria-labelledby="point-title">
      <h2 id="point-title">ポイント</h2>
      <p>APIキーは発行先のアプリ識別などに使い、OAuthのアクセストークンは付与された権限を示します。認証が通っても、対象の注文を読めるかは別に確認します。</p>
    </section>
    <section class="panel" aria-labelledby="quiz-title">
      <h2 id="quiz-title">確認問題</h2>
      <form class="quiz" data-answer="1" data-correct="正解。APIキーは発行先のアプリ識別などに使い、OAuthのアクセストークンは付与された権限を示します。認証が通っても、対象の注文を読めるかは別に確認します。" data-retry="図とポイントを見返して、もう一度考えてみましょう。">
        <fieldset>
          <legend>Aさんがログイン済みならBさんの注文も見せていい？</legend>
          <label><input type="radio" name="answer" value="1" required>注文ごとの権限を確認する</label>
          <label><input type="radio" name="answer" value="2" required>ログインしていれば全部見せる</label>
        </fieldset>
        <button type="submit">答えを確認</button>
        <output aria-live="polite"></output>
      </form>
      <noscript><details><summary>答えを見る</summary><p>注文ごとの権限を確認する</p></details></noscript>
    </section>
    <p><a href="/materials/topics/#api">APIのほかの教材を見る →</a></p>
  </main>
