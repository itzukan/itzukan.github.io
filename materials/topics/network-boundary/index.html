<body>
  <header class="wrap">
    <a href="/materials/">IT図鑑トップ</a>
    <a href="/materials/topics/#network">テーマ別の教材</a>
    <a class="lesson-search-link" href="/materials/#search-materials">教材を検索</a>
  </header>
  <main class="wrap" data-feedback-material="topic-network-boundary">
    <p class="topic">ネットワーク・通信</p>
    <h1>ネットワーク境界とは？</h1>
    <p class="lead">同じVPC（クラウド上のネットワーク）でも、WebとDBの接続範囲を分けます。</p>
    <section class="panel topic-figure" aria-labelledby="diagram-title">
      <h2 id="diagram-title">図で仕組みを理解しよう</h2>
      <ol class="sequential">
        <li><span class="topic-icon" aria-hidden="true">🌐</span><strong>Webへの入口</strong></li>
        <li><span class="topic-icon" aria-hidden="true">🛡️</span><strong>通信ルールでDBへの経路を制限</strong></li>
        <li><span class="topic-icon" aria-hidden="true">🔐</span><strong>DBも利用者の権限を確認</strong></li>
      </ol>
    </section>
    <section class="panel" aria-labelledby="point-title">
      <h2 id="point-title">ポイント</h2>
      <p>VPCやサブネットは通信範囲を整理します。内部の端末でも必要範囲の接続だけ許可し、アプリやDBでも認証・認可します。</p>
    </section>
    <section class="panel" aria-labelledby="quiz-title">
      <h2 id="quiz-title">確認問題</h2>
      <form class="quiz" data-answer="1" data-correct="正解。VPCやサブネットは通信範囲を整理します。内部の端末でも必要範囲の接続だけ許可し、アプリやDBでも認証・認可します。" data-retry="図とポイントを見返して、もう一度考えてみましょう。">
        <fieldset>
          <legend>同じVPCならすべての通信を許可してよい？</legend>
          <label><input type="radio" name="answer" value="1" required>必要な経路と通信だけを許可する</label>
          <label><input type="radio" name="answer" value="2" required>同じネットワークなので権限確認を省く</label>
        </fieldset>
        <button type="submit">答えを確認</button>
        <output aria-live="polite"></output>
      </form>
      <noscript><details><summary>答えを見る</summary><p>必要な経路と通信だけを許可する</p></details></noscript>
    </section>
    <p><a href="/materials/topics/#network">ネットワーク・通信のほかの教材を見る →</a></p>
