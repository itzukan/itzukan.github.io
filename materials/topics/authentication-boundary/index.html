<body>
  <header class="wrap">
    <a href="/materials/">IT図鑑トップ</a>
    <a href="/materials/topics/#security">テーマ別の教材</a>
    <a class="lesson-search-link" href="/materials/#search-materials">教材を検索</a>
  </header>
  <main class="wrap" data-feedback-material="topic-authentication-boundary">
    <p class="topic">セキュリティ・認証</p>
    <h1>認証境界とは？APIの呼び出し元の確認</h1>
    <p class="lead">社内システムから届いた注文要求が、許可されたサービスから来たか確かめます。</p>
    <section class="panel topic-figure" aria-labelledby="diagram-title">
      <h2 id="diagram-title">図で仕組みを理解しよう</h2>
      <ol class="sequential">
        <li><span class="topic-icon" aria-hidden="true">📱</span><strong>呼び出し元が認証情報を付ける</strong></li>
        <li><span class="topic-icon" aria-hidden="true">🪪</span><strong>APIが発行元・宛先・期限などを確認</strong></li>
        <li><span class="topic-icon" aria-hidden="true">🔒</span><strong>許可された操作だけ実行</strong></li>
      </ol>
    </section>
    <section class="panel" aria-labelledby="point-title">
      <h2 id="point-title">ポイント</h2>
      <p>識別子の自己申告だけでは本人確認になりません。アプリや人の認証方法を決め、後段で操作対象と権限を確認します。</p>
    </section>
    <section class="panel" aria-labelledby="quiz-title">
      <h2 id="quiz-title">確認問題</h2>
      <form class="quiz" data-answer="2" data-correct="正解。識別子の自己申告だけでは本人確認になりません。アプリや人の認証方法を決め、後段で操作対象と権限を確認します。" data-retry="図とポイントを見返して、もう一度考えてみましょう。">
        <fieldset>
          <legend>「社内から来た」というだけで本人確認を省略できる？</legend>
          <label><input type="radio" name="answer" value="1" required>接続元の分類だけで許可する</label>
          <label><input type="radio" name="answer" value="2" required>呼び出し元と操作権限を確認する</label>
        </fieldset>
        <button type="submit">答えを確認</button>
        <output aria-live="polite"></output>
      </form>
      <noscript><details><summary>答えを見る</summary><p>呼び出し元と操作権限を確認する</p></details></noscript>
    </section>
    <p><a href="/materials/topics/#security">セキュリティ・認証のほかの教材を見る →</a></p>
