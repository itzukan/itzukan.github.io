    <a href="/materials/">IT図鑑トップ</a>
    <a href="/materials/topics/#network">テーマ別の教材</a>
    <a class="lesson-search-link" href="/materials/#search-materials">教材を検索</a>
  </header>
  <main class="wrap" data-feedback-material="topic-mb-and-mib">
    <p class="topic">ネットワーク・通信</p>
    <h1>MBとMiBの違い</h1>
    <p class="lead">同じファイルでも、単位の基準が違うと表示上の数値がずれます。</p>
    <section class="panel topic-figure" aria-labelledby="diagram-title">
      <h2 id="diagram-title">図で仕組みを理解しよう</h2>
      <ul class="parallel">
        <li><span class="topic-icon" aria-hidden="true">📦</span><strong>1 MB＝1,000,000バイト</strong></li>
        <li><span class="topic-icon" aria-hidden="true">💾</span><strong>1 MiB＝1,048,576バイト</strong></li>
        <li><span class="topic-icon" aria-hidden="true">🧮</span><strong>同じバイト数で換算</strong></li>
      </ul>
    </section>
    <section class="panel" aria-labelledby="point-title">
      <h2 id="point-title">ポイント</h2>
      <p>MBは10の累乗、MiBは2の累乗の単位です。製品によって表記が慣用的な場合もあるので、正確に比べるときはバイト数を見ます。</p>
    </section>
    <section class="panel" aria-labelledby="quiz-title">
      <h2 id="quiz-title">確認問題</h2>
      <form class="quiz" data-answer="2" data-correct="正解。MBは10の累乗、MiBは2の累乗の単位です。製品によって表記が慣用的な場合もあるので、正確に比べるときはバイト数を見ます。" data-retry="図とポイントを見返して、もう一度考えてみましょう。">
        <fieldset>
          <legend>1,048,576バイトはおよそ何MB？</legend>
          <label><input type="radio" name="answer" value="1" required>約0.95 MB</label>
          <label><input type="radio" name="answer" value="2" required>約1.05 MB</label>
        </fieldset>
        <button type="submit">答えを確認</button>
        <output aria-live="polite"></output>
      </form>
      <noscript><details><summary>答えを見る</summary><p>約1.05 MB</p></details></noscript>
    </section>
    <p><a href="/materials/topics/#network">ネットワーク・通信のほかの教材を見る →</a></p>
