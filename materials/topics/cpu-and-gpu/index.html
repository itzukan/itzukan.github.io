    <p class="lead">たくさんの画像の画素を同時に処理する場面で、役割を比べます。</p>
    <section class="panel topic-figure" aria-labelledby="diagram-title">
      <h2 id="diagram-title">図で仕組みを理解しよう</h2>

      </ul>
    </section>
    <section class="panel" aria-labelledby="point-title">
      <h2 id="point-title">ポイント</h2>
      <p>GPUは並行に進めやすい処理に向きます。CPUも並列処理でき、GPUを使うとデータを移す時間がかかる場合があります。</p>

          <label><input type="radio" name="answer" value="2" required>対象の処理と転送時間を含めて測る</label>
