<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>基本情報道場 科目B・情報セキュリティ｜IT図鑑</title>
  <meta name="description" content="基本情報技術者試験・科目Bの情報セキュリティを3問・10問・20問・30問で練習。答え合わせのあと、判断の流れを図で確認できます。">
  <link rel="canonical" href="https://free.itzukan.com/materials/fe-b-security/practice/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/it-passport-lesson.css">
  <script defer src="/assets/dojo-sync.js?v=4"></script>
  <script defer src="/assets/it-passport-practice.js?v=11"></script>
  <script defer src="/assets/analytics.js"></script>
  <link rel="stylesheet" href="/assets/practice-dojo.css?v=4">
  <link rel="stylesheet" href="/assets/fe-security-case.css">
<link rel="stylesheet" href="/assets/materials-header.css?v=6"><script defer src="/assets/materials-header.js?v=6"></script><script defer src="/assets/material-pin-sync.js?v=13"></script><script defer src="/assets/materials-search.js?v=8"></script></head>
<body data-dojo="fe-b-security">
  <header data-library-header class="wrap">
    <a href="/materials/">IT図鑑トップ</a>
    <a href="/materials/practice/">問題シリーズ</a>
    <a href="/materials/categories/#fe-b-security">情報セキュリティの教材一覧</a>
  </header>
  <main class="wrap">
    <h1>基本情報道場 科目B</h1>
    <nav class="subject-switch" aria-label="科目Bの分野">
      <a href="/materials/fe-b/practice/">擬似言語</a>
      <a href="/materials/fe-b-security/practice/" aria-current="page">情報セキュリティ</a>
    </nav>
    <p class="lead">情報セキュリティの事例問題。答え合わせのあと、判断と対応の流れを図で確認できます。</p>
    <section id="setup" class="panel" aria-labelledby="setup-title">
      <div class="resume" id="transfer-panel" hidden>
        <h2>別の端末からの続き</h2>
        <p id="transfer-status" class="note" role="status"></p>
        <div class="actions">
          <button type="button" id="accept-transfer" hidden>リンクの続きから再開</button>
          <button type="button" id="cancel-transfer" class="secondary">閉じる</button>
        </div>
      </div>
      <div class="resume" id="resume-panel" hidden>
        <h2>途中の練習</h2>
        <p class="note" id="resume-status"></p>
        <div class="actions">
          <button type="button" id="resume" hidden>続きから再開</button>
          <button type="button" data-sync-import class="secondary" hidden>このブラウザーの続きから再開して同期</button>
          <button type="button" data-sync-delete class="secondary" hidden>同期した途中経過を削除</button>
        </div>
      </div>
      <h2 id="setup-title" tabindex="-1">何問解きますか？</h2>
      <p id="bank-status" class="note" role="status">教材の確認問題を読み込み中…</p>
      <p id="restart-note" class="note" hidden>ここで新しく始めると、保存済みの途中経過が置き換わります。</p>
      <div class="actions">
        <button type="button" data-count="3" disabled>3問を解く</button>
        <button type="button" data-count="10" disabled>10問を解く</button>
        <button type="button" data-count="20" disabled>20問を解く</button>
        <button type="button" data-count="30" disabled>30問を解く</button>
        <button type="button" id="retry" class="secondary" hidden>再読み込み</button>
      </div>
      <noscript><p>問題を解くにはJavaScriptを有効にしてください。</p></noscript>
    </section>
    <section id="exercise" aria-labelledby="progress" hidden>
      <div class="panel">
        <h2 id="progress" tabindex="-1"></h2>
        <form id="practice-question" class="quiz">
          <fieldset>
            <legend id="prompt"></legend>
            <ul id="question-context" class="question-context" aria-label="事例の条件" hidden></ul>
            <div id="choices"></div>
          </fieldset>
          <button type="submit">答えを確認</button>
        </form>
        <div id="result" class="practice-result" tabindex="-1" hidden>
          <p><strong id="verdict"></strong></p>
          <p id="explanation"></p>
        </div>
        <div class="actions"><button type="button" id="next" hidden>次の問題</button></div>
      </div>
      <div class="practice-continuity">
        <div class="continuity-row">
          <p class="note" id="storage-status" role="status"></p>
          <button type="button" id="copy-progress">続きのリンクをコピー</button>
        </div>
        <p class="note" id="copy-status" role="status"></p>
        <input type="text" id="resume-link" aria-label="続きのリンク" readonly hidden>
      </div>
      <details id="review">
        <summary>解説を見る（対応の流れ）</summary>
        <div id="review-content"></div>
        <a id="source">教材ページを開く</a>
      </details>
    </section>
    <section id="summary" class="panel" aria-labelledby="summary-title" hidden>
      <h2 id="summary-title" tabindex="-1">結果</h2>
      <p id="score"></p>
      <p id="summary-sync-status" class="note" role="status"></p>
      <div class="actions">
        <button type="button" id="again">もう一度解く</button>
        <button type="button" id="choose" class="secondary">練習のトップへ</button>
      </div>
    </section>
    <div id="dojo-sync" class="progress-recovery" hidden>
      <p class="note" role="status"></p>
      <button type="button" data-sync-refresh class="secondary" hidden>保存済みの進捗を読み直す</button>
    </div>
  </main>
</body>
</html>
