<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>問題シリーズ｜IT図鑑</title>
  <meta name="description" content="IT図鑑の問題シリーズ。ITパスポート道場と基本情報道場で、教材の確認問題をランダムに解けます。">
  <link rel="canonical" href="https://free.itzukan.com/materials/practice/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/it-passport-lesson.css">
  <script defer src="/assets/analytics.js"></script>
  <style>
    .series-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 14px; }
    .series-grid article { display: flex; flex-direction: column; align-items: flex-start; }
    .series-icon { display: inline-grid; place-items: center; width: 46px; height: 46px; margin-bottom: 10px; border-radius: 10px; background: #1d3049; font-size: 1.5rem; }
    .series-links { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding-top: 14px; }
    .series-links a { display: inline-flex; align-items: center; min-height: 44px; }
    .series-start { padding: 7px 14px; border-radius: 8px; background: #8beaf6; color: #0b1120; font-weight: 800; text-decoration: none; }
    .series-start:hover { background: #b8f6ff; }
  </style>
</head>
<body>
  <header class="wrap">
    <a href="/materials/">IT図鑑トップ</a>
    <a href="/materials/categories/">カテゴリ別の無料教材</a>
  </header>
  <main class="wrap">
    <h1>問題シリーズ</h1>
    <p class="lead">テーマを選んで、問題を解きながら復習できます。</p>
    <div class="series-grid">
      <article class="panel" aria-labelledby="passport-title">
        <span class="series-icon" aria-hidden="true">📘</span>
        <h2 id="passport-title">ITパスポート道場</h2>
        <p>ストラテジ・マネジメント・テクノロジの3分野からランダムに出題。答え合わせのあと、対応する教材の図解で復習できます。</p>
        <div class="series-links">
          <a class="series-start" href="/materials/it-passport/practice/">問題を解く →</a>
          <a href="/materials/categories/#it-passport">先に教材を読む</a>
        </div>
      </article>
      <article class="panel" aria-labelledby="fe-title">
        <span class="series-icon" aria-hidden="true">💻</span>
        <h2 id="fe-title">基本情報道場</h2>
        <p>科目Aのオリジナル問題。経営・プロジェクト管理・アルゴリズムなどを、問題と図解で練習できます。</p>
        <div class="series-links">
          <a class="series-start" href="/materials/fe/practice/">問題を解く →</a>
          <a href="/materials/categories/#fe">先に教材を読む</a>
        </div>
      </article>
    </div>
  </main>
  <footer class="wrap"><a href="/materials/">無料教材一覧へ戻る</a></footer>
</body>
</html>
